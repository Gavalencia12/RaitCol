{% load static %}
<!DOCTYPE html>
<!--Registro General de usuario -->
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniRide</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <!-- Iconos de FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
  <div class="wrapper register-wrapper">
    <form id="registerForm" data-register-url="{% url 'forgot_user_api' %}" data-csrf="{{ csrf_token }}">
      <h2>Olvidaste tu contraseña</h2>
      <p class="register-subtitle">Ingresa el correo con el que se ha registrado</p>

      <div id="register-error-message" class="error-message" style="display: none;"></div>

      

      <div class="input-field">
        <input type="email" id="email" required>
        <label><i class="fa-solid fa-envelope"></i> Correo institucional (@ucol.mx)</label>
      </div>

      

      <button type="submit">Continuar</button>

      
    </form>

    <!-- Formulario de Verificación -->
    <form id="verificationForm" data-verify-url="{% url 'forgot_verify_code_api' %}"
      data-resend-url="{% url 'forgot_resend_code_api' %}" data-home-url="{% url 'home' %}" data-csrf="{{ csrf_token }}"
      style="display: none;">
      <h2>Verificación</h2>
      <p class="register-subtitle">Hemos enviado un código a <br><strong id="sent-email-placeholder"
          style="color: #fff;"></strong></p>

      <div id="verify-error-message" class="error-message" style="display: none;"></div>
      <div id="verify-success-message" class="success-message" style="display: none;"></div>

      <div class="code-inputs-wrapper">
        <input type="text" class="code-input" maxlength="1" required pattern="\d" inputmode="numeric">
        <input type="text" class="code-input" maxlength="1" required pattern="\d" inputmode="numeric">
        <input type="text" class="code-input" maxlength="1" required pattern="\d" inputmode="numeric">
        <input type="text" class="code-input" maxlength="1" required pattern="\d" inputmode="numeric">
        <input type="text" class="code-input" maxlength="1" required pattern="\d" inputmode="numeric">
        <input type="text" class="code-input" maxlength="1" required pattern="\d" inputmode="numeric">
      </div>

      <button type="submit">Verificar Código</button>

      <div class="register">
        <p>¿No recibiste el código? <a href="#" id="resend-link">Reenviar código</a></p>
        <p class="timer-text" style="display: none;">Reenviar en <span id="timer-sec">60</span>s</p>
      </div>
    </form>
  </div>

  <script src="{% static 'js/forgot_pass.js' %}"></script>
</body>

</html>
