{% if messages %}
  {% for message in messages %}
    <div class="app-toast app-toast--{{ message.tags|default:'info' }} app-toast--show" role="alert">
      {% if message.tags == 'success' %}
        <i class="fas fa-circle-check app-toast__icon"></i>
      {% elif message.tags == 'error' %}
        <i class="fas fa-circle-exclamation app-toast__icon"></i>
      {% elif message.tags == 'warning' %}
        <i class="fas fa-triangle-exclamation app-toast__icon"></i>
      {% else %}
        <i class="fas fa-circle-info app-toast__icon"></i>
      {% endif %}
      <span class="app-toast__msg">{{ message }}</span>
      <button class="app-toast__close" onclick="dismissAppToast(this.closest('.app-toast'))" aria-label="Cerrar">
        <i class="fas fa-xmark"></i>
      </button>
    </div>
  {% endfor %}

  <script>
    function dismissAppToast(el) {
      if (!el) return;
      el.classList.remove('app-toast--show');
      el.addEventListener('transitionend', () => el.remove(), { once: true });
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.app-toast').forEach((toast, i) => {
        setTimeout(() => dismissAppToast(toast), 5000 + i * 400);
      });
    });
  </script>
{% endif %}
