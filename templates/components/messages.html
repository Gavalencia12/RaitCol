{% if messages %}
  <div class="messages-container" id="messagesContainer">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags|default:'info' }} auto-dismiss-alert">
        <div class="alert-content">
          <span>{{ message }}</span>
        </div>
        <button type="button" class="alert-close-btn" onclick="dismissAlert(this.closest('.alert'))" aria-label="Cerrar">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    {% endfor %}
  </div>

  <script>
    function dismissAlert(alertEl) {
      if (!alertEl) return;
      alertEl.classList.add('alert-fading-out');
      setTimeout(() => {
        if (alertEl && alertEl.parentNode) {
          alertEl.remove();
        }
      }, 420);
    }

    document.addEventListener('DOMContentLoaded', () => {
      const alerts = document.querySelectorAll('.auto-dismiss-alert');
      alerts.forEach((alert, index) => {
        setTimeout(() => {
          dismissAlert(alert);
        }, 4000 + (index * 300));
      });
    });
  </script>
{% endif %}
