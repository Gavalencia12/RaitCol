{% load static %}
<!DOCTYPE html>
<!-- -->
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniRide</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <div class="wrapper">
    <form id="loginForm" data-login-url="{% url 'login' %}" data-home-url="{% url 'home' %}" data-csrf="{{ csrf_token }}">
      <h1>UniRide</h1>
      <p class="register">Inicia sesión para continuar</p>
      
      <div id="error-message" style="color: #ef4444; font-weight: 500; font-size: 14px; margin-top: 15px; display: none; text-align: center; background: rgba(239, 68, 68, 0.1); padding: 8px; border-radius: 4px; border: 1px solid rgba(239, 68, 68, 0.2);"></div>

      <div class="input-field">
        <input type="text" id="email" required>
        <label>Correo universitario</label>
      </div>
      <div class="input-field">
        <input type="password"  id="password"required>
        <label>Contraseña</label>
      </div>
      
      <button type="submit">Entrar</button>
      <div class="register">
        <p><a href="{% url 'register' %}">¿No tienes una cuenta?</a></p>
      </br>
        <a href="#">Olvidaste tu contraseña</a>
      </div>
    </form>
  </div>

  <script src="{% static 'js/login.js' %}"></script>
</body>
</html>
