version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: raitcol_db
    restart: always
    environment:
      MYSQL_DATABASE: raitcol_db
      MYSQL_USER: raitcol_user
      MYSQL_PASSWORD: raitcol_pass
      MYSQL_ROOT_PASSWORD: raitcol_root_pass
    ports:
      # Mapeamos el puerto 3307 local al 3306 del contenedor
      # Esto evita conflictos si ya tienes un MySQL instalado y corriendo localmente.
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build: .
    container_name: raitcol_web
    # Mapea el directorio actual al directorio /app dentro del contenedor
    # para permitir que los cambios en el código se reflejen en tiempo real (Live Reload).
    volumes:
      - .:/app
    ports:
      - "8080:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_NAME=raitcol_db
      - DB_USER=raitcol_user
      - DB_PASSWORD=raitcol_pass
      - DB_PORT=3306
      - DEBUG=True
    depends_on:
      - db

volumes:
  mysql_data:
