<div class="confirm-modal-backdrop" id="modalConfirmation" style="display: none;">
  <div class="confirm-modal-box">
    <div class="confirm-modal-icon">
      <i class="fas fa-triangle-exclamation"></i>
    </div>
    <h3 class="confirm-modal-title">¿Finalizar viaje?</h3>
    <p class="confirm-modal-desc">
      Esta acción marcará el viaje como completado. Los pasajeros ya no podrán ver tu ruta ni el seguimiento en vivo.
    </p>
    <div class="confirm-modal-actions">
      <button type="button" class="btn-confirm-cancel" onclick="closeConfirmFinishModal()">
        Volver
      </button>
      <button type="button" class="btn-confirm-accept" id="btnModalFinishConfirm" onclick="handleFinishRide()">
        <i class="fas fa-flag-checkered"></i> Sí, finalizar
      </button>
    </div>
  </div>
</div>

<button type="button"
        class="open-modal-btn"
        id="hiddenRatingTrigger"
        data-journey-id=""
        style="position:absolute;width:0;height:0;overflow:hidden;pointer-events:none;opacity:0;"
        tabindex="-1"
        aria-hidden="true">
</button>

<div id="ratingModal">
  <div class="rating-modal-card">

    <!-- Cabecera -->
    <div class="rating-modal-header">
      <div class="rating-modal-header-icon">
        <i class="fas fa-star"></i>
      </div>
      <div class="rating-modal-header-text">
        <h2 class="rating-modal-title">¿Cómo fue tu viaje?</h2>
        <p class="rating-modal-subtitle">Tu opinión ayuda a mejorar la comunidad</p>
      </div>
      <button type="button" class="close-modal-btn rating-close-btn" aria-label="Cerrar">&times;</button>
    </div>

    <form id="ratingForm" method="POST">
      {% csrf_token %}
      <div id="modalAlerts"></div>

      <!-- Estrellas -->
      <div class="rating-modal-stars-section">
        <p class="rating-modal-stars-label">Selecciona una calificación</p>
        <div class="rating-stars-group">
          <input type="radio" id="star5" name="rating_f" value="5">
          <label for="star5" title="Excelente"><i class="fas fa-star"></i></label>
          <input type="radio" id="star4" name="rating_f" value="4">
          <label for="star4" title="Muy bueno"><i class="fas fa-star"></i></label>
          <input type="radio" id="star3" name="rating_f" value="3">
          <label for="star3" title="Bueno"><i class="fas fa-star"></i></label>
          <input type="radio" id="star2" name="rating_f" value="2">
          <label for="star2" title="Regular"><i class="fas fa-star"></i></label>
          <input type="radio" id="star1" name="rating_f" value="1" required>
          <label for="star1" title="Malo"><i class="fas fa-star"></i></label>
        </div>
      </div>

      <!-- Comentario -->
      <div class="rating-modal-comment-section">
        <label for="comment_user_v" class="rating-modal-comment-label">
          <i class="fas fa-comment-dots"></i> Comentarios
        </label>
        <textarea id="comment_user_v" name="comment_user_v" class="rating-modal-textarea"
                  rows="3" placeholder="¿Qué te pareció el viaje? Cuéntanos tu experiencia..." required></textarea>
      </div>

      <!-- Botones -->
      <div class="rating-modal-footer">
        <button type="button" class="rating-btn-cancel close-modal-btn">
          <i class="fas fa-times"></i> Cancelar
        </button>
        <button type="submit" class="rating-btn-submit" id="ratingSubmitBtn">
          <i class="fas fa-paper-plane"></i> Enviar calificación
        </button>
      </div>
    </form>

  </div>
</div>


<style>
  /* Overlay */
  #ratingModal {
    display: none !important;
    position: fixed !important;
    inset: 0 !important;
    background: rgba(0,0,0,0.65) !important;
    backdrop-filter: blur(5px) !important;
    -webkit-backdrop-filter: blur(5px) !important;
    z-index: 99999 !important;
    justify-content: center !important;
    align-items: center !important;
    padding: 16px !important;
  }
  #ratingModal.is-open {
    display: flex !important;
  }

  /* Tarjeta */
  .rating-modal-card {
    background: #ffffff !important;
    border-radius: 20px !important;
    width: 100% !important;
    max-width: 460px !important;
    box-shadow: 0 28px 64px rgba(0,0,0,0.35) !important;
    overflow: hidden !important;
    animation: ratingSlideUp 0.28s cubic-bezier(0.34,1.4,0.64,1) !important;
  }
  @keyframes ratingSlideUp {
    from { opacity: 0; transform: translateY(40px) scale(0.95); }
    to   { opacity: 1; transform: translateY(0)   scale(1);    }
  }

  /* Cabecera verde */
  .rating-modal-header {
    display: flex !important;
    align-items: center !important;
    gap: 14px !important;
    padding: 20px 22px 16px !important;
    background: linear-gradient(135deg, #00b865 0%, #007a42 100%) !important;
    color: #fff !important;
    position: relative !important;
  }
  .rating-modal-header-icon {
    width: 44px !important;
    height: 44px !important;
    background: rgba(255,255,255,0.2) !important;
    border-radius: 50% !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    font-size: 19px !important;
    flex-shrink: 0 !important;
  }
  .rating-modal-header-text { flex: 1 !important; }
  .rating-modal-title {
    margin: 0 !important;
    font-size: 17px !important;
    font-weight: 700 !important;
    color: #fff !important;
    line-height: 1.2 !important;
  }
  .rating-modal-subtitle {
    margin: 3px 0 0 !important;
    font-size: 12px !important;
    color: rgba(255,255,255,0.85) !important;
  }
  .rating-close-btn {
    position: absolute !important;
    top: 12px !important;
    right: 14px !important;
    background: rgba(255,255,255,0.18) !important;
    border: none !important;
    color: #fff !important;
    width: 28px !important;
    height: 28px !important;
    border-radius: 50% !important;
    font-size: 17px !important;
    cursor: pointer !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    line-height: 1 !important;
    transition: background 0.2s !important;
  }
  .rating-close-btn:hover { background: rgba(255,255,255,0.32) !important; }

  /* Estrellas */
  .rating-modal-stars-section {
    padding: 22px 22px 6px !important;
    text-align: center !important;
  }
  .rating-modal-stars-label {
    font-size: 13px !important;
    color: #64748b !important;
    margin-bottom: 12px !important;
    font-weight: 500 !important;
  }
  .rating-stars-group {
    display: flex !important;
    flex-direction: row-reverse !important;
    justify-content: center !important;
    gap: 4px !important;
  }
  .rating-stars-group input[type="radio"] { display: none !important; }
  .rating-stars-group label {
    font-size: 40px !important;
    color: #d1d5db !important;
    cursor: pointer !important;
    transition: color 0.15s, transform 0.15s !important;
    line-height: 1 !important;
  }
  .rating-stars-group label:hover,
  .rating-stars-group label:hover ~ label,
  .rating-stars-group input:checked ~ label {
    color: #f59e0b !important;
    transform: scale(1.15) !important;
  }

  /* Comentario */
  .rating-modal-comment-section { padding: 6px 22px 14px !important; }
  .rating-modal-comment-label {
    display: block !important;
    font-size: 13px !important;
    font-weight: 600 !important;
    color: #374151 !important;
    margin-bottom: 7px !important;
  }
  .rating-modal-comment-label i { color: #00b865 !important; margin-right: 5px !important; }
  .rating-modal-textarea {
    width: 100% !important;
    border: 1.5px solid #e2e8f0 !important;
    border-radius: 10px !important;
    padding: 10px 13px !important;
    font-size: 14px !important;
    color: #1e293b !important;
    resize: vertical !important;
    transition: border-color 0.2s, box-shadow 0.2s !important;
    font-family: inherit !important;
    box-sizing: border-box !important;
    background: #f8fafc !important;
  }
  .rating-modal-textarea:focus {
    outline: none !important;
    border-color: #00b865 !important;
    background: #fff !important;
    box-shadow: 0 0 0 3px rgba(0,184,101,0.13) !important;
  }

  /* Alertas */
  #modalAlerts:not(:empty) {
    margin: 0 22px 10px !important;
    padding: 9px 13px !important;
    background: #fef2f2 !important;
    border-left: 4px solid #ef4444 !important;
    border-radius: 8px !important;
    font-size: 13px !important;
    color: #b91c1c !important;
    line-height: 1.5 !important;
  }

  /* Footer / botones */
  .rating-modal-footer {
    display: flex !important;
    justify-content: flex-end !important;
    gap: 10px !important;
    padding: 14px 22px 20px !important;
    border-top: 1px solid #f1f5f9 !important;
  }
  .rating-btn-cancel {
    background: #f1f5f9 !important;
    color: #475569 !important;
    border: none !important;
    border-radius: 10px !important;
    padding: 10px 18px !important;
    font-size: 14px !important;
    font-weight: 500 !important;
    cursor: pointer !important;
    transition: background 0.2s !important;
  }
  .rating-btn-cancel:hover { background: #e2e8f0 !important; }
  .rating-btn-submit {
    background: linear-gradient(135deg, #00b865, #007a42) !important;
    color: #fff !important;
    border: none !important;
    border-radius: 10px !important;
    padding: 10px 20px !important;
    font-size: 14px !important;
    font-weight: 600 !important;
    cursor: pointer !important;
    display: flex !important;
    align-items: center !important;
    gap: 7px !important;
    transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s !important;
    box-shadow: 0 4px 12px rgba(0,120,66,0.3) !important;
  }
  .rating-btn-submit:hover:not(:disabled) {
    opacity: 0.92 !important;
    transform: translateY(-1px) !important;
    box-shadow: 0 6px 18px rgba(0,120,66,0.4) !important;
  }
  .rating-btn-submit:active:not(:disabled) { transform: translateY(0) !important; }
  .rating-btn-submit:disabled { opacity: 0.6 !important; cursor: not-allowed !important; }
</style>


<script>
  // ── Abrir / cerrar modal de calificación ─────────────────────────────────
  document.addEventListener('click', function (e) {
    const modal = document.getElementById('ratingModal');
    const form  = document.getElementById('ratingForm');

    const openBtn  = e.target.closest('.open-modal-btn');
    const closeBtn = e.target.closest('.close-modal-btn');

    if (openBtn) {
      const journeyId = openBtn.getAttribute('data-journey-id');
      if (form && journeyId) {
        form.action = `/journey/${journeyId}/rate/modal/`;
      }
      if (modal) modal.classList.add('is-open');
    }

    if (closeBtn || (modal && e.target === modal)) {
      if (modal) modal.classList.remove('is-open');
    }
  });

  // ── Envío por AJAX ───────────────────────────────────────────────────────
  document.addEventListener('submit', function (e) {
    if (!e.target || e.target.id !== 'ratingForm') return;
    e.preventDefault();

    const form      = e.target;
    const formData  = new FormData(form);
    const actionUrl = form.action;
    const csrfToken = (form.querySelector('[name=csrfmiddlewaretoken]') || {}).value || '';
    const alertsBox = document.getElementById('modalAlerts');
    const submitBtn = document.getElementById('ratingSubmitBtn');

    if (submitBtn) {
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enviando...';
    }
    if (alertsBox) alertsBox.innerHTML = '';

    fetch(actionUrl, {
      method: 'POST',
      headers: { 'X-CSRFToken': csrfToken, 'X-Requested-With': 'XMLHttpRequest' },
      body: formData
    })
    .then(res => res.json().then(data => ({ status: res.status, body: data })))
    .then(({ status, body }) => {
      if (status === 200 && body.success) {
        const modal = document.getElementById('ratingModal');
        if (modal) modal.classList.remove('is-open');
        location.reload();
      } else {
        if (alertsBox) {
          let html = '';
          if (body.errors) {
            for (let f in body.errors) html += `<div>• ${body.errors[f]}</div>`;
          } else {
            html = '<div>Ocurrió un error. Inténtalo de nuevo.</div>';
          }
          alertsBox.innerHTML = html;
        }
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Enviar calificación';
        }
      }
    })
    .catch(err => {
      console.error('Error:', err);
      if (alertsBox) alertsBox.innerHTML = '<div>Error de conexión. Revisa tu internet.</div>';
      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Enviar calificación';
      }
    });
  });
</script>
