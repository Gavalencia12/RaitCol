<!-- Modal de Reporte -->
<div class="report-user-modal-backdrop" id="reportUserModal">
  <div class="report-user-modal-box">

    <div class="report-user-modal-header">
      <h3>
        <i class="fas fa-exclamation-triangle"></i>
        Reportar Usuario
      </h3>
    </div>

    <form id="reportUserForm">
      <input type="hidden" id="report-user-id" name="report_user_id">
      <input type="hidden" id="report-ride-id" name="report_ride_id">

      <div class="report-user-modal-radio-options" style="margin-bottom: 20px;">

        <label class="radio-option-container">
          <input type="radio" name="report_reason" value="1" required>
          <span>Incumplimiento de ruta</span>
        </label>

        <label class="radio-option-container">
          <input type="radio" name="report_reason" value="2">
          <span>Comportamiento irrespetuoso</span>
        </label>

        <label class="radio-option-container">
          <input type="radio" name="report_reason" value="3">
          <span>Retraso excesivo</span>
        </label>

        <label class="radio-option-container">
          <input type="radio" name="report_reason" value="4">
          <span>Exceso de pasajeros</span>
        </label>

        <label class="radio-option-container">
          <input type="radio" name="report_reason" value="5">
          <span>Otros (detallar abajo)</span>
        </label>

      </div>

      <div class="report-user-modal-textarea">
        <label for="report-user-description">
          <i class="fas fa-comment-dots"></i>
          Detalles adicionales
        </label>
        <textarea id="report-user-description" name="description" rows="4"
          placeholder="Describe lo que sucedió..."></textarea>
      </div>

      <div class="report-user-modal-actions">
        <button type="button" onclick="closeReportUserModal()">
          Cancelar
        </button>
        <button type="submit">
          Enviar Reporte
        </button>
      </div>
    </form>

  </div>
</div>
