{% load static %}
<!DOCTYPE html>
<!--Registro General de usuario -->
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniRide</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <!-- Iconos de FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
  <div class="wrapper register-wrapper">
    <form id="registerForm" data-register-url="{% url 'register_api' %}" data-csrf="{{ csrf_token }}">
      <h2>Registro</h2>
      <p class="register-subtitle">Crea tu cuenta institucional</p>

      <div id="register-error-message" class="error-message" style="display: none;"></div>

      <div class="register-grid">
        <div class="input-field">
          <input type="text" id="first_name" required>
          <label><i class="fa-solid fa-user"></i> Nombre</label>
        </div>
        <div class="input-field">
          <input type="text" id="last_name" required>
          <label><i class="fa-solid fa-user"></i> Apellido</label>
        </div>
        <div class="input-field">
          <input type="text" id="username" required>
          <label><i class="fa-solid fa-at"></i> Usuario</label>
        </div>
        <div class="input-field">
          <input type="text" id="no_cuenta_v" maxlength="8" required pattern="\d+" oninput="this.value = this.value.replace(/[^0-9]/g, '')"
            title="El número de cuenta solo debe contener dígitos">
          <label> <i class="fa-solid fa-id-card"></i> Nº Cuenta</label>
        </div>
      </div>

      <div class="input-field">
        <input type="email" id="email" required>
        <label><i class="fa-solid fa-envelope"></i> Correo institucional (@ucol.mx)</label>
      </div>

      <div class="input-field">
        <input type="password" id="password" required>
        <label><i class="fa-solid fa-key"></i> Contraseña</label>
      </div>

      <div class="custom-file-upload">
        <label for="credential_udc_file" class="file-upload-label">
          <i class="fa-solid fa-id-card"></i> 
          <span>Sube tu Credencial UDEC</span>
        </label>
        <input type="file" id="credential_udc_file" class="hidden-file-input" accept="image/*" required>
        <div id="registerCredentialPreviewContainer" style="display: none; margin-top: 12px; text-align: center;">
          <img id="registerCredentialPreviewImg" src="" alt="Vista previa credencial" style="max-height: 110px; border-radius: 8px; border: 2px solid rgba(255,255,255,0.8); object-fit: cover;">
        </div>
      </div>

      <div class="custom-file-upload">
        <label for="user_udc_file" class="file-upload-label">
          <i class="fa-solid fa-camera"></i> 
          <span>Sube tu Foto de Perfil</span>
        </label>
        <input type="file" id="user_udc_file" class="hidden-file-input" accept="image/*" required>
        <div id="registerUserImgPreviewContainer" style="display: none; margin-top: 12px; text-align: center;">
          <img id="registerUserImgPreview" src="" alt="Vista previa rostro" style="width: 100px; height: 100px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.8); object-fit: cover; display: inline-block;">
        </div>
      </div>

      <button type="submit">Registrarse</button>

      <div class="register">
        <p><a href="{% url 'login_page' %}">¿Ya tienes una cuenta? Inicia sesión</a></p>
      </div>
    </form>

    <!-- Formulario de Verificación -->
    <form id="verificationForm" data-verify-url="{% url 'verify_code_api' %}"
      data-resend-url="{% url 'resend_code_api' %}" data-home-url="{% url 'home' %}" data-csrf="{{ csrf_token }}"
      style="display: none;">
      <h2>Verificación</h2>
      <p class="register-subtitle">Hemos enviado un código a <br><strong id="sent-email-placeholder"
          style="color: #fff;"></strong></p>

      <div id="verify-error-message" class="error-message" style="display: none;"></div>
      <div id="verify-success-message" class="success-message" style="display: none;"></div>

      <div class="code-inputs-wrapper">
        <input type="text" class="code-input" maxlength="1" required pattern="\d" inputmode="numeric">
        <input type="text" class="code-input" maxlength="1" required pattern="\d" inputmode="numeric">
        <input type="text" class="code-input" maxlength="1" required pattern="\d" inputmode="numeric">
        <input type="text" class="code-input" maxlength="1" required pattern="\d" inputmode="numeric">
        <input type="text" class="code-input" maxlength="1" required pattern="\d" inputmode="numeric">
        <input type="text" class="code-input" maxlength="1" required pattern="\d" inputmode="numeric">
      </div>

      <button type="submit">Verificar Código</button>

      <div class="register">
        <p>¿No recibiste el código? <a href="#" id="resend-link">Reenviar código</a></p>
        <p class="timer-text" style="display: none;">Reenviar en <span id="timer-sec">60</span>s</p>
      </div>
    </form>
  </div>

  <script src="{% static 'js/register.js' %}"></script>
</body>

</html>
