{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniRide - Inicio</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
  <!-- FontAwesome para iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

  <nav class="navbar">
    <div class="navbar-brand">
      <i class="fa-solid fa-car-side"></i> UniRide
    </div>
    <div class="navbar-menu">
      <span class="user-info">
        <i class="fa-solid fa-user"></i> {{ request.user.email }}
      </span>
      <button class="logout-btn" id="logoutBtn" data-logout-url="{% url 'logout' %}"
        data-login-url="{% url 'login_page' %}" data-csrf="{{ csrf_token }}">
        <i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión
      </button>
    </div>
  </nav>

  <div class="main-container">
    <div class="welcome-header">
      <h1>{{ title }}</h1>
      <p>{{ description }}</p>
    </div>
  </div>

  <script src="{% static 'js/dashboard.js' %}"></script>
</body>

</html>
